<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
</head>

<body>

<h2>📦 Admin Panel</h2>

<input id="question" placeholder="Сұрақ"><br><br>

<input id="v1" placeholder="Вариант 1"><br>
<input id="v2" placeholder="Вариант 2"><br>
<input id="v3" placeholder="Вариант 3"><br>
<input id="v4" placeholder="Вариант 4"><br>
<input id="v5" placeholder="Вариант 5"><br><br>

<input id="correct" placeholder="Правильный ответ"><br><br>

<button onclick="addQuestion()">➕ Добавить</button>

<hr>

<h3>📥 JSON импорт</h3>
<textarea id="json" rows="6" cols="50"></textarea><br>
<button onclick="importJSON()">Импортировать</button>

<hr>

<h3>🔍 Поиск</h3>
<input id="search" placeholder="Поиск..." oninput="loadQuestions()">

<h3>📋 Вопросы</h3>
<div id="list"></div>

<hr>

<h3>✏️ Редактирование</h3>

<div id="editBox" style="display:none; border:1px solid #000; padding:10px;">

  <input id="e_question" placeholder="Вопрос"><br><br>

  <input id="e_v1" placeholder="Вариант 1"><br>
  <input id="e_v2" placeholder="Вариант 2"><br>
  <input id="e_v3" placeholder="Вариант 3"><br>
  <input id="e_v4" placeholder="Вариант 4"><br>
  <input id="e_v5" placeholder="Вариант 5"><br><br>

  <input id="e_correct" placeholder="Правильный ответ"><br><br>

  <button onclick="saveEdit()">💾 Сохранить</button>
  <button onclick="closeEdit()">❌ Отмена</button>

</div>

<p id="msg"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  doc,
  getDoc,
  getDocs,
  deleteDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCAL20P_NiAsJ54BHTW81FZba0FYNOc6SU",
  authDomain: "prst-99760.firebaseapp.com",
  projectId: "prst-99760"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* STATE */
let currentEditId = null;

/* MSG */
function setMsg(t) {
  document.getElementById("msg").innerText = t;
}

/* ADMIN CHECK */
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    alert("Войдите в систему");
    window.location.href = "/";
    return;
  }

  const ref = doc(db, "users", user.email);
  const snap = await getDoc(ref);

  if (!snap.exists() || snap.data().role !== "admin") {
    alert("Нет доступа");
    window.location.href = "/";
    return;
  }

  setMsg("✅ Admin доступ открыт");
  loadQuestions();
});

/* ADD */
window.addQuestion = async function () {

  const q = question.value;

  const variants = [v1.value, v2.value, v3.value, v4.value, v5.value].filter(v => v);
  const correct = document.getElementById("correct").value;

  if (!q || !correct || variants.length < 2) {
    setMsg("❌ Заполни всё");
    return;
  }

  if (!variants.includes(correct)) {
    setMsg("❌ Правильный ответ должен быть в вариантах");
    return;
  }

  await addDoc(collection(db, "tests"), {
    question: q,
    variants,
    correct
  });

  setMsg("✅ Добавлено");
  loadQuestions();
};

/* IMPORT */
window.importJSON = async function () {

  try {
    const data = JSON.parse(json.value);

    for (let q of data) {
      if (!q.question || !q.variants || !q.correct) continue;

      await addDoc(collection(db, "tests"), q);
    }

    setMsg("📦 Импорт завершён");
    loadQuestions();

  } catch (e) {
    setMsg("❌ JSON ошибка");
  }
};

/* LOAD + SEARCH */
window.loadQuestions = async function () {

  const list = document.getElementById("list");
  const search = document.getElementById("search").value.toLowerCase();

  const snap = await getDocs(collection(db, "tests"));

  list.innerHTML = "";

  snap.forEach(docSnap => {

    const data = docSnap.data();

    if (search && !data.question.toLowerCase().includes(search)) return;

    const div = document.createElement("div");

    div.style.border = "1px solid #ccc";
    div.style.padding = "10px";
    div.style.margin = "10px 0";

    div.innerHTML = `
      <b>${data.question}</b><br>
      ${data.variants.join(", ")}<br>
      ✅ ${data.correct}<br><br>

      <button onclick='openEdit(${JSON.stringify(docSnap.id)}, ${JSON.stringify(data)})'>✏️</button>
      <button onclick="deleteQuestion('${docSnap.id}')">🗑</button>
    `;

    list.appendChild(div);
  });
};

/* DELETE */
window.deleteQuestion = async function (id) {

  if (!confirm("Удалить?")) return;

  await deleteDoc(doc(db, "tests", id));

  setMsg("🗑 Удалено");
  loadQuestions();
};

/* OPEN EDIT */
window.openEdit = function (id, data) {

  currentEditId = id;

  editBox.style.display = "block";

  e_question.value = data.question;

  e_v1.value = data.variants[0] || "";
  e_v2.value = data.variants[1] || "";
  e_v3.value = data.variants[2] || "";
  e_v4.value = data.variants[3] || "";
  e_v5.value = data.variants[4] || "";

  e_correct.value = data.correct;
};

/* SAVE EDIT */
window.saveEdit = async function () {

  const question = e_question.value;

  const variants = [e_v1.value, e_v2.value, e_v3.value, e_v4.value, e_v5.value].filter(v => v);
  const correct = e_correct.value;

  if (!question || !correct || variants.length < 2) {
    setMsg("❌ Заполни всё");
    return;
  }

  if (!variants.includes(correct)) {
    setMsg("❌ Правильный ответ должен быть в вариантах");
    return;
  }

  await updateDoc(doc(db, "tests", currentEditId), {
    question,
    variants,
    correct
  });

  setMsg("✅ Обновлено");

  closeEdit();
  loadQuestions();
};

/* CLOSE EDIT */
window.closeEdit = function () {
  editBox.style.display = "none";
  currentEditId = null;
};

</script>

</body>
</html>
