<!DOCTYPE html>

<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест жүйесі</title>

<style>
body {
    font-family: Arial;
    margin: 20px;
}

.question {
    margin-bottom: 25px;
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

.variant {
    display: block;
    margin: 5px 0;
    cursor: pointer;
}

.correct { color: green; }
.incorrect { color: red; }

.pagination button {
    margin: 5px;
}

.active {
    background: blue;
    color: white;
}

img {
    max-width: 400px;
    display: block;
    margin: 10px 0;
    border-radius: 8px;
}

.correct-answer {
    color: green;
    font-weight: bold;
}

.wrong-answer {
    color: red;
    font-weight: bold;
}

/* scroll buttons */
#scrollTopBtn, #scrollBottomBtn {
    position: fixed;
    right: 15px;
    padding: 10px 15px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: white;
    cursor: pointer;
    opacity: 0.7;
}

#scrollTopBtn { bottom: 80px; }
#scrollBottomBtn { bottom: 20px; }

</style>

</head>

<body>

<h1>Тест</h1>

<button onclick="shuffleQuestions()">Араластыр (барлығы)</button> <button onclick="shuffleCurrentPage()">Араластыр (бет)</button> <button onclick="resetAll()">Қайта бастау</button> <button onclick="showAllAnswers()">Жауап көрсету</button>

<br><br>

<div>
    <label>Сұрақ саны:</label>
    <input type="number" id="questionCount" value="50" style="width:60px;">

```
<label>Диапазон:</label>
<input type="number" id="rangeStart" value="0" style="width:60px;">
-
<input type="number" id="rangeEnd" value="300" style="width:60px;">

<button onclick="applyCustomSelection()">Қолдану</button>
```

</div>

<div id="quiz"></div>
<div id="pagination"></div>

<button id="scrollTopBtn">⬆️</button> <button id="scrollBottomBtn">⬇️</button>

<script>

let currentPage = 1;
const questionsPerPage = 50;

let allQuestions = [];
let activeQuestions = [];

/* LOAD */

async function loadTest() {
    const response = await fetch('test.txt');
    const text = await response.text();

    allQuestions = parseQuestions(text);

    renderPage(currentPage);
    renderPagination();
}

function parseQuestions(text) {
    const blocks = text.split(/<question>/)
        .map(b => b.trim())
        .filter(b => b.length > 0);

    return blocks.map(block => {

        const question = block.split('<variant>')[0]
            .replace('<img>', '')
            .trim();

        const imgMatch = block.match(/<img>(.*?)\n/);
        const image = imgMatch ? imgMatch[1].trim() : null;

        const variants = [...block.matchAll(/<variant>(.*)/g)]
            .map(m => m[1].trim());

        return { question, image, variants };
    });
}

/* RENDER */

function getSource() {
    return activeQuestions.length ? activeQuestions : allQuestions;
}

function renderPage(page) {
    const source = getSource();

    const start = (page - 1) * questionsPerPage;
    const end = page * questionsPerPage;

    const pageQuestions = source.slice(start, end);
    renderCustomQuestions(pageQuestions, start);
}

function renderCustomQuestions(questionsArray, globalStartIndex = 0) {

    const quiz = document.getElementById('quiz');
    quiz.innerHTML = '';

    questionsArray.forEach((q, index) => {

        const correctValues = [q.variants[0]];
        const shuffled = shuffle([...q.variants]);

        const qIndex = globalStartIndex + index;

        const div = document.createElement('div');
        div.className = 'question';

        const p = document.createElement('p');
        p.textContent = (qIndex + 1) + '. ' + q.question;

        div.appendChild(p);

        if (q.image) {
            const img = document.createElement('img');
            img.src = q.image;
            div.appendChild(img);
        }

        const result = document.createElement('div');
        result.id = 'result' + qIndex;

        shuffled.forEach((v) => {

            const label = document.createElement('label');
            label.className = 'variant';

            const input = document.createElement('input');
            input.type = 'radio';
            input.name = 'q' + qIndex;
            input.value = v;

            input.addEventListener('change', () => {

                document.querySelectorAll(`input[name="q${qIndex}"]`)
                    .forEach(el => el.parentElement.style.fontWeight = 'normal');

                label.style.fontWeight = 'bold';

                const selected = document.querySelector(`input[name="q${qIndex}"]:checked`).value;
                checkAnswer(qIndex, [selected], correctValues);
            });

            label.appendChild(input);
            label.appendChild(document.createTextNode(' ' + v));

            div.appendChild(label);
        });

        div.appendChild(result);
        quiz.appendChild(div);
    });
}

/* LOGIC */

function showAllAnswers() {
    const source = getSource();

    source.forEach((q, i) => {
        const correct = q.variants[0]; // правильный ответ

        const inputs = document.querySelectorAll(`input[name="q${i}"]`);

        inputs.forEach(input => {
            const label = input.parentElement;

            // очистка старых классов
            label.classList.remove('correct-answer');

            // если это правильный ответ → зелёный
            if (input.value === correct) {
                label.classList.add('correct-answer');
            }
        });

        const result = document.getElementById('result' + i);
        if (result) {
            result.innerHTML = `Дұрыс жауап: <b>${correct}</b>`;
            result.className = 'correct';
        }
    });
}
    
/* SHOW ANSWERS */

function showAllAnswers() {
    const source = getSource();

    source.forEach((q, i) => {
        const result = document.getElementById('result' + i);
        if (result) {
            result.innerHTML = `Дұрыс жауап: <b>${q.variants[0]}</b>`;
            result.className = 'correct';
            result.style.display = 'block';
        }
    });
}

/* UTILS */

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function shuffleQuestions() {
    allQuestions = shuffle([...allQuestions]);
    currentPage = 1;
    renderPage(currentPage);
    renderPagination();
}

function shuffleCurrentPage() {
    const source = getSource();

    const start = (currentPage - 1) * questionsPerPage;
    const end = currentPage * questionsPerPage;

    const part = source.slice(start, end);
    const shuffledPart = shuffle([...part]);

    source.splice(start, part.length, ...shuffledPart);

    renderPage(currentPage);
}

/* PAGINATION */

function renderPagination() {
    const div = document.getElementById('pagination');
    div.innerHTML = '';

    const source = getSource();
    const pages = Math.ceil(source.length / questionsPerPage);

    for (let i = 1; i <= pages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;

        if (i === currentPage) btn.classList.add('active');

        btn.onclick = () => {
            currentPage = i;
            renderPage(i);
            renderPagination();
        };

        div.appendChild(btn);
    }
}

/* CUSTOM RANGE */

function applyCustomSelection() {

    const count = parseInt(document.getElementById('questionCount').value);
    const start = parseInt(document.getElementById('rangeStart').value);
    const end = parseInt(document.getElementById('rangeEnd').value);

    if (start < 0 || end > allQuestions.length || start >= end) {
        alert("Қате диапазон");
        return;
    }

    let rangeQuestions = allQuestions.slice(start, end);
    rangeQuestions = shuffle([...rangeQuestions]);

    activeQuestions = rangeQuestions.slice(0, count);

    currentPage = 1;
    renderPage(currentPage);
    renderPagination();
}

/* RESET */

function resetAll() {
    activeQuestions = [];
    currentPage = 1;
    renderPage(currentPage);
    renderPagination();
}

/* SCROLL */

document.getElementById("scrollTopBtn").onclick = () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
};

document.getElementById("scrollBottomBtn").onclick = () => {
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
};

loadTest();

</script>

</body>
</html>
