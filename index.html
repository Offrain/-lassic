<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест жүйесі</title>

<style>
body { font-family: Arial; margin: 20px; }

.question {
  margin-bottom: 25px;
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

.variant { display: block; margin: 5px 0; cursor: pointer; }

.correct { color: green; }
.incorrect { color: red; }

.pagination button { margin: 5px; }

.active { background: blue; color: white; }

img {
  max-width: 400px;
  display: block;
  margin: 10px 0;
  border-radius: 8px;
}

.correct-answer { color: green; font-weight: bold; }
.wrong-answer { color: red; font-weight: bold; }

#scrollTopBtn, #scrollBottomBtn {
  position: fixed;
  right: 15px;
  padding: 10px 15px;
  font-size: 18px;
  border: none;
  border-radius: 8px;
  background: #333;
  color: white;
  cursor: pointer;
  opacity: 0.7;
}

#scrollTopBtn { bottom: 80px; }
#scrollBottomBtn { bottom: 20px; }
</style>

</head>

<body>

<div id="auth">
  <h2>Кіру</h2>
  <input id="email" placeholder="email"><br><br>
  <input id="pass" type="password" placeholder="password"><br><br>
  <button onclick="login()">Кіру</button>
  <p id="msg"></p>
</div>

<div id="app" style="display:none;">

<h1>Тест</h1>

<button onclick="zoomIn()">🔍</button>
<button onclick="shuffleQuestions()">Араластыр</button>
<button onclick="resetAll()">Қайта бастау</button>
<button onclick="showAllAnswers()">Жауап көрсету</button>

<br><br>

<div id="quiz"></div>
<div id="pagination"></div>

<button id="scrollTopBtn">⬆️</button>
<button id="scrollBottomBtn">⬇️</button>

</div>

<script type="module">

/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyCAL20P_NiAsJ54BHTW81FZba0FYNOc6SU",
  authDomain: "prst-99760.firebaseapp.com",
  projectId: "prst-99760"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= UI ================= */
function setMsg(t) {
  document.getElementById("msg").innerText = t;
}

function showApp() {
  document.getElementById("auth").style.display = "none";
  document.getElementById("app").style.display = "block";
}

function hideApp() {
  document.getElementById("auth").style.display = "block";
  document.getElementById("app").style.display = "none";
}

/* ================= LOGIN ================= */
window.login = async function () {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("pass").value;

  try {
    await signInWithEmailAndPassword(auth, email, pass);
    setMsg("OK кірді");
  } catch (e) {
    setMsg(e.message);
  }
};

/* ================= AUTH ================= */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    hideApp();
    return;
  }

  showApp();
  loadTest();
});

/* ================= DATA ================= */
let allQuestions = [];
let currentPage = 1;
const perPage = 50;

/* ================= LOAD TEST (FIXED) ================= */
async function loadTest() {

  try {
    console.log("Loading tests...");

    const querySnapshot = await getDocs(collection(db, "tests"));

    console.log("Docs:", querySnapshot.size);

    allQuestions = [];

    querySnapshot.forEach((docSnap) => {
      const d = docSnap.data();

      allQuestions.push({
        question: d.question,
        variants: d.variants,
        correct: d.correct
      });
    });

    render();

  } catch (e) {
    console.error("LOAD ERROR:", e);
  }
}

/* ================= RENDER ================= */
function render() {

  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";

  const start = (currentPage - 1) * perPage;
  const end = start + perPage;

  const page = allQuestions.slice(start, end);

  page.forEach((q, i) => {

    const index = start + i;

    const div = document.createElement("div");
    div.className = "question";

    const p = document.createElement("p");
    p.textContent = (index + 1) + ". " + q.question;

    div.appendChild(p);

    const correct = q.correct;

    q.variants.forEach(v => {
      const label = document.createElement("label");
      label.className = "variant";

      const input = document.createElement("input");
      input.type = "radio";
      input.name = "q" + index;
      input.value = v;

      input.onchange = () => {
        if (v === correct) {
          label.classList.add("correct-answer");
        } else {
          label.classList.add("wrong-answer");
        }
      };

      label.appendChild(input);
      label.appendChild(document.createTextNode(" " + v));
      div.appendChild(label);
    });

    quiz.appendChild(div);
  });
}

/* ================= UTIL ================= */
window.resetAll = () => location.reload();

window.shuffleQuestions = () => {
  allQuestions.sort(() => Math.random() - 0.5);
  render();
};

window.showAllAnswers = () => {
  document.querySelectorAll(".variant").forEach(el => {
    el.style.fontWeight = "bold";
  });
};

window.zoomIn = () => {
  document.body.style.zoom =
    (document.body.style.zoom ? parseFloat(document.body.style.zoom) : 1) + 0.1;
};

document.getElementById("scrollTopBtn").onclick = () =>
  window.scrollTo({ top: 0, behavior: "smooth" });

document.getElementById("scrollBottomBtn").onclick = () =>
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

</script>

</body>
</html>
