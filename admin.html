<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
</head>

<body>

<h2>📦 Admin Panel</h2>

<!-- ADD -->
<h3>➕ Добавить вопрос</h3>

<input id="question" placeholder="Сұрақ"><br><br>

<input id="v1" placeholder="Вариант 1"><br>
<input id="v2" placeholder="Вариант 2"><br>
<input id="v3" placeholder="Вариант 3"><br>
<input id="v4" placeholder="Вариант 4"><br>
<input id="v5" placeholder="Вариант 5"><br><br>

<b>Выбери правильный ответ:</b><br>

<label><input type="radio" name="correctAdd" id="a1"> Вариант 1</label><br>
<label><input type="radio" name="correctAdd" id="a2"> Вариант 2</label><br>
<label><input type="radio" name="correctAdd" id="a3"> Вариант 3</label><br>
<label><input type="radio" name="correctAdd" id="a4"> Вариант 4</label><br>
<label><input type="radio" name="correctAdd" id="a5"> Вариант 5</label><br><br>

<button onclick="addQuestion()">➕ Добавить</button>

<hr>

<!-- IMPORT -->
<h3>📥 JSON импорт</h3>
<textarea id="json" rows="6" cols="50"></textarea><br>
<button onclick="importJSON()">Импортировать</button>

<hr>

<!-- SEARCH -->
<h3>🔍 Поиск</h3>
<input id="search" placeholder="Поиск..." oninput="loadQuestions()">

<h3>📋 Вопросы</h3>
<div id="list"></div>

<hr>

<!-- EDIT -->
<h3>✏️ Редактирование</h3>

<div id="editBox" style="display:none; border:1px solid #000; padding:10px;">

  <input id="e_question" placeholder="Вопрос"><br><br>

  <input id="e_v1" placeholder="Вариант 1"><br>
  <input id="e_v2" placeholder="Вариант 2"><br>
  <input id="e_v3" placeholder="Вариант 3"><br>
  <input id="e_v4" placeholder="Вариант 4"><br>
  <input id="e_v5" placeholder="Вариант 5"><br><br>

  <b>Правильный ответ:</b><br>

  <label><input type="radio" name="correctEdit" id="r1"> Вариант 1</label><br>
  <label><input type="radio" name="correctEdit" id="r2"> Вариант 2</label><br>
  <label><input type="radio" name="correctEdit" id="r3"> Вариант 3</label><br>
  <label><input type="radio" name="correctEdit" id="r4"> Вариант 4</label><br>
  <label><input type="radio" name="correctEdit" id="r5"> Вариант 5</label><br><br>

  <button onclick="saveEdit()">💾 Сохранить</button>
  <button onclick="closeEdit()">❌ Отмена</button>

</div>

<p id="msg"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  doc,
  getDoc,
  getDocs,
  deleteDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCAL20P_NiAsJ54BHTW81FZba0FYNOc6SU",
  authDomain: "prst-99760.firebaseapp.com",
  projectId: "prst-99760"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* MSG */
function setMsg(t) {
  document.getElementById("msg").innerText = t;
}

/* AUTH */
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    alert("Войдите в систему");
    window.location.href = "/";
    return;
  }

  const ref = doc(db, "users", user.email);
  const snap = await getDoc(ref);

  if (!snap.exists() || snap.data().role !== "admin") {
    alert("Нет доступа");
    window.location.href = "/";
    return;
  }

  setMsg("✅ Admin доступ открыт");
  loadQuestions();
});

/* ADD */
window.addQuestion = async function () {

  const q = question.value;

  const variants = [v1.value, v2.value, v3.value, v4.value, v5.value].filter(v => v);

  const radios = [a1, a2, a3, a4, a5];

  let correct = null;

  radios.forEach((r, i) => {
    if (r.checked) correct = variants[i];
  });

  if (!q || variants.length < 2) {
    setMsg("❌ Заполни вопрос и минимум 2 варианта");
    return;
  }

  if (!correct) {
    setMsg("❌ Выбери правильный ответ");
    return;
  }

  await addDoc(collection(db, "tests"), {
    question: q,
    variants,
    correct
  });

  setMsg("✅ Добавлено");

  document.querySelectorAll('input[name="correctAdd"]').forEach(r => r.checked = false);

  loadQuestions();
};

/* IMPORT */
window.importJSON = async function () {

  try {
    const data = JSON.parse(json.value);

    for (let q of data) {
      if (!q.question || !q.variants || !q.correct) continue;
      await addDoc(collection(db, "tests"), q);
    }

    setMsg("📦 Импорт завершён");
    loadQuestions();

  } catch (e) {
    setMsg("❌ JSON ошибка");
  }
};

/* LOAD QUESTIONS (INLINE EDIT) */
window.loadQuestions = async function () {

  const list = document.getElementById("list");
  const search = document.getElementById("search").value.toLowerCase();

  const snap = await getDocs(collection(db, "tests"));

  list.innerHTML = "";

  snap.forEach(docSnap => {

    const data = docSnap.data();

    if (search && !data.question.toLowerCase().includes(search)) return;

    const id = docSnap.id;

    const variants = data.variants || [];

    list.innerHTML += `
      <div style="border:1px solid #ccc; padding:10px; margin:10px 0">

        <b>${data.question}</b><br>
        ${variants.join(", ")}<br>
        ✅ ${data.correct}<br><br>

        <button onclick="toggleEdit('${id}')">✏️ Edit</button>
        <button onclick="deleteQuestion('${id}')">🗑 Delete</button>

        <div id="edit-${id}" style="display:none; margin-top:10px; border-top:1px solid #999; padding-top:10px;">

          <input id="q-${id}" value="${data.question}"><br><br>

          <input id="v1-${id}" value="${variants[0] || ""}"><br>
          <input id="v2-${id}" value="${variants[1] || ""}"><br>
          <input id="v3-${id}" value="${variants[2] || ""}"><br>
          <input id="v4-${id}" value="${variants[3] || ""}"><br>
          <input id="v5-${id}" value="${variants[4] || ""}"><br><br>

          <b>Правильный ответ:</b><br>

          ${variants.map((v, i) => `
            <label>
              <input type="radio" name="correct-${id}" value="${i}" ${data.correct === v ? "checked" : ""}>
              ${v}
            </label><br>
          `).join("")}

          <br>
          <button onclick="saveInlineEdit('${id}')">💾 Save</button>
          <button onclick="toggleEdit('${id}')">❌ Cancel</button>

        </div>
      </div>
    `;
  });
};

/* TOGGLE EDIT */
window.toggleEdit = function(id) {
  const box = document.getElementById(`edit-${id}`);
  box.style.display = box.style.display === "none" ? "block" : "none";
};

/* SAVE INLINE EDIT */
window.saveInlineEdit = async function(id) {

  const question = document.getElementById(`q-${id}`).value;

  const variants = [
    document.getElementById(`v1-${id}`).value,
    document.getElementById(`v2-${id}`).value,
    document.getElementById(`v3-${id}`).value,
    document.getElementById(`v4-${id}`).value,
    document.getElementById(`v5-${id}`).value
  ].filter(v => v);

  const radios = document.querySelectorAll(`input[name="correct-${id}"]`);

  let correct = null;

  radios.forEach((r, i) => {
    if (r.checked) correct = variants[i];
  });

  if (!question || variants.length < 2 || !correct) {
    setMsg("❌ Заполни всё и выбери правильный ответ");
    return;
  }

  await updateDoc(doc(db, "tests", id), {
    question,
    variants,
    correct
  });

  setMsg("✅ Обновлено");
  loadQuestions();
};

/* DELETE */
window.deleteQuestion = async function (id) {

  if (!confirm("Удалить?")) return;

  await deleteDoc(doc(db, "tests", id));

  setMsg("🗑 Удалено");
  loadQuestions();
};

</script>

</body>
</html>
