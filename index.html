<!DOCTYPE html>

<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест жүйесі</title>

<style>
body {
    font-family: Arial;
    margin: 20px;
}

.question {
    margin-bottom: 25px;
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

.variant {
    display: block;
    margin: 5px 0;
    cursor: pointer;
}

.correct { color: green; }
.incorrect { color: red; }

.pagination button {
    margin: 5px;
}

.active {
    background: blue;
    color: white;
}

img {
    max-width: 400px;
    display: block;
    margin: 10px 0;
    border-radius: 8px;
}

.correct-answer {
    color: green;
    font-weight: bold;
}
    
/* dark mode */
.wrong-answer {
    color: red;
    font-weight: bold;
}

body.dark {
    background: #121212;
    color: #eee;
}

body.dark .question {
    background: #1e1e1e;
    padding: 10px;
    border-radius: 8px;
}

body.dark button {
    background: #333;
    color: white;
    border: none;
}

body.dark .variant {
    color: #ddd;
}
    
/* scroll buttons */
#scrollTopBtn, #scrollBottomBtn {
    position: fixed;
    right: 15px;
    padding: 10px 15px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: white;
    cursor: pointer;
    opacity: 0.7;
}
    
.q-watermark {
    font-size: 12px;
    color: rgba(0,0,0,0.15);
    margin-bottom: 5px;
    user-select: none;
    pointer-events: none;
    letter-spacing: 1px;
}
  
#watermark-corner {
    position: fixed;
    top: 20px;
    right: 20px;

    font-size: 60px;
    font-weight: 500;
    letter-spacing: 1px;

    color: rgba(0, 0, 0, 0.10);

    transform: rotate(-12deg);

    pointer-events: none;
    user-select: none;

    z-index: 0;
    white-space: nowrap;

    opacity: 0.9;
}
@media (max-width: 768px) {
    #watermark-corner {
        font-size: 30px;
        top: 15px;
        right: 15px;
        color: rgba(0, 0, 0, 0.12);
        transform: rotate(-10deg);
    }
}

@media (max-width: 400px) {
    #watermark-corner {
        font-size: 30px;
        top: 10px;
        right: 10px;
        color: rgba(0, 0, 0, 0.14);
        transform: rotate(-8deg);
    }
}
    
#scrollTopBtn { bottom: 80px; }
#scrollBottomBtn { bottom: 20px; }

</style>

</head>

<body>
<div id="watermark-corner"></div>
<div id="auth">
  <h2>Кіру</h2>

  <input id="email" placeholder="email"><br><br>
  <input id="pass" type="password" placeholder="password"><br><br>

  <button onclick="login()">Кіру</button>

  <p id="msg"></p>
</div>
    
</div>  
    
<!-- 🔥 APP (ТВОЙ ТЕСТ) -->
<div id="app" style="display:none;">

<h1>Тест</h1>

<button onclick="zoomIn()">  🔍  </button>
<button onclick="toggleTheme()">🌙 Тема</button>
<button onclick="shuffleQuestions()">Араластыр (барлығы)</button> <button onclick="shuffleCurrentPage()">Араластыр (бет)</button> <button onclick="resetAll()">Қайта бастау</button> <button onclick="showAllAnswers()">Жауап көрсету</button>

<br><br>

<div>
    <label>Сұрақ саны:</label>
    <input type="number" id="questionCount" value="50" style="width:60px;">
    
<br><br>  
    
<label>Диапазон:</label>
<input type="number" id="rangeStart" value="0" style="width:60px;">
- 
<input type="number" id="rangeEnd" value="300" style="width:60px;">

<button onclick="applyCustomSelection()">Қолдану</button>

</div>

<div id="quiz"></div>
<div id="pagination"></div>

<button id="scrollTopBtn">⬆️</button> <button id="scrollBottomBtn">⬇️</button>


<script type="module">
    
/* ================= FIREBASE ================= */

  import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyCAL20P_NiAsJ54BHTW81FZba0FYNOc6SU",
  authDomain: "prst-99760.firebaseapp.com",
  projectId: "prst-99760",
  storageBucket: "prst-99760.firebasestorage.app",
  messagingSenderId: "72274793382",
  appId: "1:72274793382:web:8f0e20d0290e497985f567"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= DEVICE ================= */
function getDeviceId() {
  let id = localStorage.getItem("deviceId");
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("deviceId", id);
  }
  return id;
}

/* ================= UI FIX ================= */
function showApp() {
  document.getElementById("auth").style.display = "none";
  document.getElementById("app").style.display = "block";
}

function hideApp() {
  document.getElementById("auth").style.display = "block";
  document.getElementById("app").style.display = "none";
  document.getElementById("watermark").textContent = "";
}
    
/* ================= ANTI-CHEAT ================= */
document.addEventListener("copy", (e) => {
  e.preventDefault();
});

document.addEventListener("selectstart", (e) => {
  e.preventDefault();
});

 document.addEventListener("keydown", (e) => {
  if (
    (e.ctrlKey && e.key === "c") ||
    (e.ctrlKey && e.key === "a") ||
    (e.ctrlKey && e.key === "u")
  ) {
    e.preventDefault();
  }
});

/* ================= REGISTER ================= */
window.register = async function () {
  const email = emailEl().value;
  const pass = passEl().value;

  try {
    await createUserWithEmailAndPassword(auth, email, pass);

    await setDoc(doc(db, "users", email), {
      email,
      deviceId: getDeviceId(),
      blocked: false
    });

    setMsg("OK тіркелді");
  } catch (e) {
    setMsg(e.message);
  }
};

/* ================= LOGIN ================= */
window.login = async function () {
  const email = emailEl().value;
  const pass = passEl().value;

  try {
    await signInWithEmailAndPassword(auth, email, pass);

    const ref = doc(db, "users", email);
    const snap = await getDoc(ref);

    const deviceId = getDeviceId();

    if (!snap.exists()) {
      await setDoc(ref, {
        email,
        deviceId,
        blocked: false
      });
    } else {
      const data = snap.data();

      if (data.deviceId && data.deviceId !== deviceId) {
        await signOut(auth);
        setMsg("❌ Доступ запрещён (другое устройство)");
        return;
      }

      await updateDoc(ref, {
        deviceId,
        blocked: false
      });
    }

    setMsg("OK кірді");

  } catch (e) {
    setMsg(e.message);
  }
};

/* ================= AUTH STATE ================= */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    hideApp();
    return;
  }

  const ref = doc(db, "users", user.email);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await signOut(auth);
    hideApp();
    return;
  }

  const data = snap.data();

  if (data.deviceId !== getDeviceId()) {
    await signOut(auth);
    alert("Сессия закрыта (другое устройство)");
    hideApp();
    return;
  }

showApp();
setWatermark(user.email);
loadTest(); // 🔥 ВАЖНО: теперь тест всегда грузится
});

/* ================= HELPERS ================= */
function emailEl() {
  return document.getElementById("email");
}
function passEl() {
  return document.getElementById("pass");
}
function setMsg(t) {
  document.getElementById("msg").innerText = t;
}

/* ================= TEST ================= */
let zoomLevel = 1; // 1 = 100%
let currentPage = 1;
const questionsPerPage = 50;

let allQuestions = [];
let activeQuestions = [];

/* LOAD */

async function loadTest() {
  try {
    console.log("Loading tests...");

    const querySnapshot = await getDocs(collection(db, "tests"));

    console.log("Docs found:", querySnapshot.size);

    allQuestions = [];

    querySnapshot.forEach((docSnap) => {
      const d = docSnap.data();

      console.log("Question:", d);

      allQuestions.push({
        question: d.question,
        variants: d.variants,
        correct: d.correct,
        image: d.image || null
      });
    });

    renderPage(currentPage);
    renderPagination();

  } catch (e) {
    console.error("LOAD ERROR:", e);
  }
}
    
/* Watermark*/ 
function getWatermarkText() {
    const user = auth.currentUser;
    if (!user) return "";

    return user.email.split("@")[0];
}

function setWatermark(email) {
    const name = email.split("@")[0];
    const corner = document.getElementById("watermark-corner");
    if (corner) corner.textContent = name;
}    
    
/* LOAD */
function parseQuestions(text) {
    const blocks = text.split(/<question>/)
        .map(b => b.trim())
        .filter(b => b.length > 0);

    return blocks.map(block => {

        const question = block.split('<variant>')[0]
            .replace('<img>', '')
            .trim();

        const imgMatch = block.match(/<img>(.*?)\n/);
        const image = imgMatch ? imgMatch[1].trim() : null;

        const variants = [...block.matchAll(/<variant>(.*)/g)]
            .map(m => m[1].trim());

        return { question, image, variants };
    });
}

/* RENDER */

function getSource() {
    return activeQuestions.length ? activeQuestions : allQuestions;
}

function renderPage(page) {
    const source = getSource();

    const start = (page - 1) * questionsPerPage;
    const end = page * questionsPerPage;

    const pageQuestions = source.slice(start, end);
    renderCustomQuestions(pageQuestions, start);
}

function renderCustomQuestions(questionsArray, globalStartIndex = 0) {
    const quiz = document.getElementById('quiz');
    quiz.innerHTML = '';

    questionsArray.forEach((q, index) => {
        const correctValues = q.correct;
        const shuffled = shuffle([...q.variants]);

        const qIndex = globalStartIndex + index;

        const div = document.createElement('div');
        div.className = 'question';
        
        const wm = document.createElement('div');
        wm.className = 'q-watermark';
        wm.textContent = getWatermarkText();
        div.appendChild(wm);
    
        const p = document.createElement('p');
        p.textContent = (qIndex + 1) + '. ' + q.question;

        div.appendChild(p);

        if (q.image) {
            const img = document.createElement('img');
            img.src = q.image;
            div.appendChild(img);
        }

        const result = document.createElement('div');
        result.id = 'result' + qIndex;

        shuffled.forEach((v) => {

            const label = document.createElement('label');
            label.className = 'variant';

            const input = document.createElement('input');
            input.type = 'radio';
            input.name = 'q' + qIndex;
            input.value = v;

            input.addEventListener('change', () => {

                document.querySelectorAll(`input[name="q${qIndex}"]`)
                    .forEach(el => el.parentElement.style.fontWeight = 'normal');

                label.style.fontWeight = 'bold';

                const selected = document.querySelector(`input[name="q${qIndex}"]:checked`).value;
                checkAnswer(qIndex, [selected], correctValues);
            });

            label.appendChild(input);
            label.appendChild(document.createTextNode(' ' + v));

            div.appendChild(label);
        });

        div.appendChild(result);
        quiz.appendChild(div);
    });
}

/* LOGIC */
    
function checkAnswer(qIndex, selectedValues, correctValues) {

    const correctArr = Array.isArray(correctValues)
        ? correctValues
        : [correctValues];

    const result = document.getElementById('result' + qIndex);

    const inputs = document.querySelectorAll(`input[name="q${qIndex}"]`);

    inputs.forEach(input => {
        const label = input.parentElement;

        label.classList.remove('correct-answer', 'wrong-answer');

        if (correctArr.includes(input.value)) {
            label.classList.add('correct-answer');
        }

        if (input.checked && !correctArr.includes(input.value)) {
            label.classList.add('wrong-answer');
        }
    });

    const isCorrect =
        selectedValues.length === correctArr.length &&
        selectedValues.every(v => correctArr.includes(v));

    if (isCorrect) {
        result.textContent = 'Дұрыс ✅';
        result.className = 'correct';
    } else {
        result.innerHTML = `Қате ❌<br>Дұрыс жауап: <b>${correctArr[0]}</b>`;
        result.className = 'incorrect';
    }
}
    
/* SHOW ANSWERS */
    
function showAllAnswers() {
    const source = getSource();

    source.forEach((q, i) => {
        const correct = Array.isArray(q.correct) ? q.correct[0] : q.correct;

        const inputs = document.querySelectorAll(`input[name="q${i}"]`);

        inputs.forEach(input => {
            const label = input.parentElement;
            label.classList.remove('correct-answer');

            if (input.value === correct) {
                label.classList.add('correct-answer');
            }
        });

        const result = document.getElementById('result' + i);
        if (result) {
            result.innerHTML = `Дұрыс жауап: <b>${correct}</b>`;
            result.className = 'correct';
        }
    });
}
/* UTILS */

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function shuffleQuestions() {
    allQuestions = shuffle([...allQuestions]);
    currentPage = 1;
    renderPage(currentPage);
    renderPagination();
}

function shuffleCurrentPage() {
    const source = getSource();

    const start = (currentPage - 1) * questionsPerPage;
    const end = currentPage * questionsPerPage;

    const part = source.slice(start, end);
    const shuffledPart = shuffle([...part]);

    source.splice(start, part.length, ...shuffledPart);

    renderPage(currentPage);
}

/* PAGINATION */

function renderPagination() {
    const div = document.getElementById('pagination');
    div.innerHTML = '';

    const source = getSource();
    const pages = Math.ceil(source.length / questionsPerPage);

    for (let i = 1; i <= pages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;

        if (i === currentPage) btn.classList.add('active');

        btn.onclick = () => {
            currentPage = i;
            renderPage(i);
            renderPagination();
        };

        div.appendChild(btn);
    }
}

/* CUSTOM RANGE */

function applyCustomSelection() {

    const count = parseInt(document.getElementById('questionCount').value);
    const start = parseInt(document.getElementById('rangeStart').value);
    const end = parseInt(document.getElementById('rangeEnd').value);

    if (start < 0 || end > allQuestions.length || start >= end) {
        alert("Қате диапазон");
        return;
    }

    let rangeQuestions = allQuestions.slice(start, end);
    rangeQuestions = shuffle([...rangeQuestions]);

    activeQuestions = rangeQuestions.slice(0, count);

    currentPage = 1;
    renderPage(currentPage);
    renderPagination();
}

/* RESET */

function resetAll() {
    activeQuestions = [];
    currentPage = 1;
    renderPage(currentPage);
    renderPagination();
}
    
/* DARK MODE */
    function toggleTheme() {
    document.body.classList.toggle('dark');

    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

window.onload = () => {
    loadTest();

    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
    }
};

    
/* ZOOM */
function zoomIn() {
    zoomLevel += 0.2;
    if (zoomLevel > 2.0) zoomLevel = 1;
    document.body.style.zoom = zoomLevel;
}
    
window.addEventListener("wheel", function (e) {
    if (e.ctrlKey) {
        e.preventDefault();

        if (e.deltaY < 0) {
            zoomLevel += 0.1;
        } else {
            zoomLevel -= 0.1;
        }

        zoomLevel = Math.min(2, Math.max(0.5, zoomLevel));

        document.body.style.zoom = zoomLevel;
    }
}, { passive: false });

window.toggleTheme = toggleTheme;   
window.zoomIn = zoomIn;
window.shuffleQuestions = shuffleQuestions;
window.shuffleCurrentPage = shuffleCurrentPage;
window.resetAll = resetAll;
window.showAllAnswers = showAllAnswers;
window.applyCustomSelection = applyCustomSelection;
        
/* SCROLL */

document.getElementById("scrollTopBtn").onclick = () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
};

document.getElementById("scrollBottomBtn").onclick = () => {
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
};

loadTest();

    
</script>

</body>
</html>
