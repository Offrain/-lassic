<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
</head>

<body>

<h2>📦 Admin Panel - Тест загрузка</h2>

<input id="question" placeholder="Сұрақ"><br><br>

<input id="v1" placeholder="Вариант 1"><br>
<input id="v2" placeholder="Вариант 2"><br>
<input id="v3" placeholder="Вариант 3"><br>
<input id="v4" placeholder="Вариант 4"><br>
<input id="v5" placeholder="Вариант 5 (опционально)"><br><br>

<input id="correct" placeholder="Правильный ответ"><br><br>

<button onclick="addQuestion()">➕ Добавить</button>

<hr>

<h3>📥 JSON импорт</h3>
<textarea id="json" rows="10" cols="50" placeholder='[{"question":"2+2?","variants":["3","4"],"correct":"4"}]'></textarea><br>

<button onclick="importJSON()">Импортировать</button>

<p id="msg"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyCAL20P_NiAsJ54BHTW81FZba0FYNOc6SU",
  authDomain: "prst-99760.firebaseapp.com",
  projectId: "prst-99760"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* ================= UI ================= */
function setMsg(t) {
  document.getElementById("msg").innerText = t;
}

/* ================= ADMIN CHECK ================= */
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    alert("Войдите в систему");
    window.location.href = "/";
    return;
  }

  const ref = doc(db, "users", user.email);
  const snap = await getDoc(ref);

  if (!snap.exists() || snap.data().role !== "admin") {
    alert("Нет доступа");
    window.location.href = "/";
    return;
  }

  setMsg("✅ Admin доступ открыт");
});

/* ================= ADD QUESTION ================= */
window.addQuestion = async function () {

  try {

    const q = document.getElementById("question").value;

    const variants = [
      document.getElementById("v1").value,
      document.getElementById("v2").value,
      document.getElementById("v3").value,
      document.getElementById("v4").value,
      document.getElementById("v5").value
    ].filter(v => v);

    const correct = document.getElementById("correct").value;

    if (!q || !correct || variants.length < 2) {
      setMsg("❌ Заполни вопрос и минимум 2 варианта");
      return;
    }

    if (!variants.includes(correct)) {
      setMsg("❌ Правильный ответ должен быть в вариантах");
      return;
    }

    await addDoc(collection(db, "tests"), {
      question: q,
      variants,
      correct
    });

    setMsg("✅ Добавлено!");

  } catch (e) {
    console.error(e);
    setMsg("❌ Ошибка: " + e.message);
  }
};

/* ================= IMPORT JSON (FIXED) ================= */
window.importJSON = async function () {

  try {

    const raw = document.getElementById("json").value.trim();

    if (!raw) {
      setMsg("❌ JSON пустой");
      return;
    }

    console.log("RAW JSON:", raw);

    let data;

    try {
      data = JSON.parse(raw);
    } catch (e) {
      console.error("JSON PARSE ERROR:", e);
      setMsg("❌ JSON ошибка: " + e.message);
      return;
    }

    if (!Array.isArray(data)) {
      setMsg("❌ JSON должен быть массивом []");
      return;
    }

    for (let q of data) {

      if (!q.question || !q.variants || !q.correct) {
        console.log("SKIP INVALID:", q);
        continue;
      }

      await addDoc(collection(db, "tests"), {
        question: q.question,
        variants: q.variants,
        correct: q.correct
      });
    }

    setMsg("📦 Импорт завершён!");

  } catch (e) {
    console.error(e);
    setMsg("❌ Ошибка: " + e.message);
  }
};

</script>

</body>
</html>
